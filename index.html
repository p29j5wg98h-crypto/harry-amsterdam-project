<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Amsterdam Love on Tour Gallery</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #111, #000);
    color: white;
  }

  header {
    text-align: center;
    padding: 50px 20px 20px;
  }

  header h1 {
    font-size: 42px;
    margin: 0;
    letter-spacing: 1px;
  }

  header p {
    color: #aaa;
    margin-top: 10px;
  }

  .upload {
    display: flex;
    justify-content: center;
    margin: 30px;
  }

  .upload label {
    background: white;
    color: black;
    padding: 12px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
  }

  .upload label:hover {
    transform: scale(1.05);
  }

  input[type="file"] {
    display: none;
  }

  .gallery {
    column-count: 3;
    column-gap: 15px;
    padding: 20px;
  }

  @media (max-width: 900px) {
    .gallery { column-count: 2; }
  }

  @media (max-width: 600px) {
    .gallery { column-count: 1; }
  }

  .card {
    break-inside: avoid;
    margin-bottom: 15px;
    background: #111;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  .card img {
    width: 100%;
    display: block;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    padding: 10px 12px;
    font-size: 14px;
    align-items: center;
  }

  .like {
    cursor: pointer;
    color: #ff4d8d;
    user-select: none;
  }

  .empty {
    text-align: center;
    color: #777;
    margin-top: 40px;
  }

</style>
</head>

<body>

<header>
  <h1>Amsterdam Love on Tour</h1>
  <p>a dreamy fan gallery of Harry Styles ✨</p>
</header>

<div class="upload">
  <label>
    Upload your concert photos
    <input type="file" id="fileInput" multiple accept="image/*">
  </label>
</div>

<div id="empty" class="empty">no memories yet… be the first ✨</div>
<div class="gallery" id="gallery"></div>

<script>
  const fileInput = document.getElementById("fileInput");
  const gallery = document.getElementById("gallery");
  const empty = document.getElementById("empty");

  fileInput.addEventListener("change", (e) => {
    const files = Array.from(e.target.files);

    files.forEach(file => {
      const reader = new FileReader();

      reader.onload = function(event) {
        createCard(event.target.result);
      };

      reader.readAsDataURL(file);
    });

    empty.style.display = "none";
  });

  function createCard(src) {
    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = src;

    const footer = document.createElement("div");
    footer.className = "card-footer";

    let likes = 0;

    const likeBtn = document.createElement("div");
    likeBtn.className = "like";
    likeBtn.innerHTML = `♥ 0`;

    likeBtn.onclick = () => {
      likes++;
      likeBtn.innerHTML = `♥ ${likes}`;
    };

    const tag = document.createElement("div");
    tag.style.color = "#888";
    tag.textContent = "Amsterdam ✨";

    footer.appendChild(likeBtn);
    footer.appendChild(tag);

    card.appendChild(img);
    card.appendChild(footer);

    gallery.prepend(card);
  }
</script>

</body>
</html>
